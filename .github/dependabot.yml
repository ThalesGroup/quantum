version: 2

updates:
  # npm dependencies of the root and of all the workspace packages
  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/packages/*'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '05:00'
      timezone: 'Europe/Paris'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 20
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
    groups:
      npm-minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  # GitHub Actions used in the workflows, pinned by commit SHA
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '05:00'
      timezone: 'Europe/Paris'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 20
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
    groups:
      github-actions:
        patterns:
          - '*'
