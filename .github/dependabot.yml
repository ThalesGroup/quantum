version: 2

updates:
  # npm dependencies of the root and of all the workspace packages
  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/packages/*'
      - '/apps/*'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '05:00'
      timezone: 'Europe/Paris'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 20
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
      npm-major:
        applies-to: version-updates
        update-types:
          - 'major'
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'

  # GitHub Actions used in the workflows, pinned by commit SHA
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '05:00'
      timezone: 'Europe/Paris'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 20
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
    groups:
      github-actions:
        patterns:
          - '*'

  # The same updates for the nextgen branch (Quantum NextGen). Dependabot reads this file from the
  # default branch only, so these entries must be on main to take effect.
  - package-ecosystem: 'npm'
    target-branch: 'nextgen'
    directories:
      - '/'
      - '/packages/*'
      - '/apps/*'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '05:00'
      timezone: 'Europe/Paris'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 20
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
    groups:
      nextgen-npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
      nextgen-npm-major:
        applies-to: version-updates
        update-types:
          - 'major'
      nextgen-npm-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    target-branch: 'nextgen'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '05:00'
      timezone: 'Europe/Paris'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 20
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
    groups:
      nextgen-github-actions:
        patterns:
          - '*'
